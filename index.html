<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事件中心 · 工业智能协作平台</title>
  <style>
    :root {
      --ink: #172b4d;
      --muted: #71809a;
      --line: #e6ebf3;
      --canvas: #f3f6fb;
      --paper: #fff;
      --blue: #3976f6;
      --blue-dark: #245fdf;
      --blue-soft: #eaf1ff;
      --cyan: #29a9bd;
      --teal: #138f83;
      --amber: #d18b26;
      --red: #d95757;
      --green: #27956d;
      --sidebar: 180px;
      --shadow: 0 8px 26px rgba(31, 57, 96, .055);
      --sans: "Aptos", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    /* Keep the scrollbar lane reserved as content and dialogs change. */
    html, textarea, .table-scroll, .version-list, .flow-panel .panel-body,
    .condition-field-popup-list, .action-resource-list, .action-config-body,
    .action-prompt-popup-list,
    .modal:not(:is(.stats-dialog, .action-dialog, .test-dialog, .run-detail-dialog, .event-dialog)),
    .modal.test-dialog .modal-body,
    .modal.test-dialog .test-result, .run-panel-scroll, .run-data-json,
    .run-json, .run-text-input, .modal.event-dialog .modal-body,
    .event-param-body, .history-list, .event-source-tabs {
      scrollbar-gutter: stable;
    }
    body { margin: 0; color: var(--ink); background: var(--canvas); font-family: var(--sans); font-size: 13px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(57,118,246,.22); outline-offset: 1px; }
    .app { min-height: 100vh; }
    .sidebar { position: fixed; inset: 0 auto 0 0; z-index: 20; width: var(--sidebar); padding: 15px 12px 12px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid #e7ebf1; }
    .brand { height: 58px; padding: 0 8px; display: flex; align-items: center; gap: 9px; color: #2456bc; }
    .brand-mark { width: 34px; height: 34px; position: relative; display: grid; place-items: center; color: #fff; border-radius: 11px 11px 11px 4px; background: linear-gradient(145deg,#65b9ed,#426be8); box-shadow: 0 5px 12px #376de533; }
    .brand-mark svg { width: 20px; height: 20px; }
    .brand-copy { line-height: 1.15; }
    .brand-copy b { display: block; font-size: 13px; letter-spacing: .03em; }
    .brand-copy small { color: #8b9bb5; font-size: 9px; letter-spacing: .12em; }
    .tenant { height: 36px; margin: 8px 2px 14px; padding: 0 9px; display: flex; align-items: center; justify-content: space-between; color: #60708a; border: 1px solid var(--line); border-radius: 8px; background: #fbfcfe; font-size: 11px; }
    .tenant span:first-child { display: flex; align-items: center; gap: 7px; }
    .tenant .tenant-dot { width: 7px; height: 7px; border-radius: 50%; background: #4dbd93; box-shadow: 0 0 0 3px #e7f7f0; }
    .nav-label { padding: 11px 8px 5px; color: #9aa7ba; font-size: 10px; font-weight: 700; letter-spacing: .12em; }
    .nav-item { height: 38px; margin: 2px 0; padding: 0 10px; display: flex; align-items: center; gap: 10px; color: #5f6f88; text-decoration: none; border-radius: 8px; font-size: 12px; transition: background .16s,color .16s; }
    .nav-item:hover { color: #2e66dd; background: #f4f7fc; }
    .nav-item.active { color: #245fdf; background: #eaf1ff; font-weight: 700; box-shadow: inset 3px 0 #3976f6; }
    .nav-icon { width: 17px; height: 17px; display: inline-grid; place-items: center; flex: none; }
    .nav-icon svg { width: 17px; height: 17px; }
    .nav-bottom { margin-top: auto; padding-top: 10px; border-top: 1px solid #edf0f5; }
    .profile { padding: 11px 5px 1px; display: flex; align-items: center; gap: 9px; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #e8efff; color: #3d70e7; font-weight: 700; }
    .profile strong { display: block; font-size: 11px; }
    .profile small { color: #98a4b6; font-size: 10px; }
    .workspace { min-height: 100vh; margin-left: var(--sidebar); padding: 18px 22px 24px; }
    .page { max-width: 1600px; margin: 0 auto; }
    .hero { min-height: 138px; padding: 16px 22px 14px; position: relative; overflow: hidden; border: 1px solid #dce7fb; border-radius: 12px; background: linear-gradient(108deg,#edf3ff 0%,#f1f5ff 58%,#e6efff 100%); }
    .hero:after { content: ""; position: absolute; right: 15%; top: -95px; width: 220px; height: 220px; border: 1px solid rgba(73,126,228,.08); border-radius: 50%; box-shadow: 0 0 0 24px rgba(73,126,228,.03),0 0 0 50px rgba(73,126,228,.02); pointer-events: none; }
    .hero-main { position: relative; z-index: 1; }
    h1 { margin: 6px 0 5px; color: #1b3155; font-size: 23px; letter-spacing: -.035em; line-height: 1.2; }
    .hero h1 { margin: 0 0 4px; font-size: 21px; }
    .hero p { margin: 0; color: #7687a3; font-size: 11px; }
    .hero-metrics { margin-top: 14px; padding-top: 10px; position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); border-top: 1px solid rgba(86,125,193,.17); }
    .hero-metric { min-height: 42px; padding: 1px 18px; }
    .hero-metric:first-child { padding-left: 0; }
    .hero-metric + .hero-metric { border-left: 1px solid rgba(86,125,193,.17); }
    .hero-metric span { display: block; color: #7188ae; font-size: 10px; }
    .hero-metric strong { display: block; margin-top: 4px; color: #25436f; font-size: 18px; line-height: 1; letter-spacing: -.025em; }
    .btn { min-height: 34px; padding: 0 13px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid #dfe5ee; border-radius: 7px; background: #fff; color: #53647e; font-weight: 600; transition: .16s; }
    .btn:hover { border-color: #afc5f1; color: #2f69df; background: #f9fbff; }
    .btn svg { width: 15px; height: 15px; }
    .btn-primary { color: #fff; border-color: var(--blue); background: var(--blue); box-shadow: 0 4px 10px #3976f62c; }
    .btn-primary:hover { color: #fff; border-color: var(--blue-dark); background: var(--blue-dark); }
    .btn-quiet { background: transparent; }
    .btn-danger { color: var(--red); }
    .btn-small { min-height: 28px; padding: 0 9px; font-size: 11px; }
    .btn-copy-draft { color: #4774cd; border-color: #d8e3f6; background: #f7faff; box-shadow: none; }
    .btn-copy-draft:hover { color: #2f63c2; border-color: #bfd1f1; background: #eff5ff; }
    .btn:disabled { cursor: not-allowed; opacity: .48; box-shadow: none; }
    .filter-card,.table-card,.panel { border: 1px solid #e6ebf2; border-radius: 10px; background: #fff; box-shadow: 0 2px 7px rgba(31,57,96,.025); }
    .filter-card { margin: 12px 0 10px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .filters { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .field,.select { height: 33px; padding: 0 10px; color: #394d6a; border: 1px solid #e1e7ef; border-radius: 6px; background: #fff; }
    .field { width: 220px; }
    .select { min-width: 122px; }
    .field::placeholder { color: #a1adbd; }
    .filter-note { color: #98a5b7; font-size: 10px; }
    .table-card { overflow: visible; }
    .table-scroll { overflow-x: auto; border-radius: 10px 10px 0 0; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; text-align: left; }
    .event-list-table { width: 100%; min-width: 0; table-layout: fixed; }
    .event-list-table col:nth-child(1) { width: 22%; }
    .event-list-table col:nth-child(2) { width: 22%; }
    .event-list-table col:nth-child(3) { width: 9%; }
    .event-list-table col:nth-child(4) { width: 9%; }
    .event-list-table col:nth-child(5) { width: 16%; }
    .event-list-table col:nth-child(6) { width: 7%; }
    .event-list-table col:nth-child(7) { width: 15%; }
    .event-list-table :is(th,td) { padding-left: 10px; padding-right: 10px; }
    .event-list-table :is(th,td):nth-child(2),
    .event-list-table :is(th,td):nth-child(5),
    .event-list-table :is(th,td):nth-child(7) { border-left: 1px solid #edf1f6; padding-left: 14px; }
    .event-list-table td:nth-child(7) .action-links { justify-content: flex-start; gap: 10px; }
    .event-list-table td:nth-child(7) .more-btn { padding-right: 2px; padding-left: 2px; }
    .event-list-table .event-info-detail { max-width: 100%; }
    .event-list-table .event-name { overflow: hidden; text-overflow: ellipsis; }
    th { height: 42px; padding: 0 13px; color: #72819a; border-bottom: 1px solid #e9edf3; background: #f8fafd; font-size: 10px; font-weight: 700; letter-spacing: .025em; }
    td { height: 64px; padding: 8px 13px; color: #51627a; border-bottom: 1px solid #f0f2f6; font-size: 11px; }
    tbody tr:hover { background: #f9fbff; }
    tbody tr:last-child td { border-bottom: 0; }
    .event-name { color: #263b5a; font-size: 12px; font-weight: 700; }
    .subline { margin-top: 5px; color: #9aa6b7; font-size: 10px; }
    .event-state { margin-top: 6px; display: inline-flex; align-items: center; gap: 6px; color: #8090a5; font-size: 10px; }
    .event-state-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: #b9c2ce; }
    .event-state.running .event-state-dot { background: #30a978; }
    .event-state.paused .event-state-dot { background: #e2a13b; }
    .event-info { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .event-info-detail { max-width: 260px; overflow: hidden; color: #73839a; text-overflow: ellipsis; font-size: 10px; }
    .process-summary { display: flex; flex-direction: column; gap: 5px; color: #52647c; font-size: 10px; }
    .process-summary span:last-child { color: #8391a5; }
    .process-empty { color: #a7b2c0; font-size: 13px; }
    .table-help { width: 14px; height: 14px; margin-left: 5px; display: inline-grid; place-items: center; color: #8d9cb2; border: 1px solid #bbc6d6; border-radius: 50%; cursor: default; font-size: 9px; line-height: 1; vertical-align: middle; }
    .table-help:focus-visible { outline: 2px solid #8cb2f7; outline-offset: 2px; }
    .source-badge,.tag { display: inline-flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 5px; background: #f0f5ff; color: #3970dc; font-size: 10px; font-weight: 650; }
    .source-badge.timer { background: #eef6f0; color: #35805b; }
    .source-badge.webhook { background: #fff3e8; color: #b46a23; }
    .source-badge.mqtt { background: #eaf8f7; color: #218b84; }
    .source-badge.kafka { background: #f1edff; color: #7452c6; }
    .source-badge.pulsar { background: #eaf1ff; color: #3c70dc; }
    .truncate { max-width: 230px; overflow: hidden; text-overflow: ellipsis; }
    .switch-cell { display: flex; align-items: center; gap: 7px; }
    .switch { width: 32px; height: 18px; padding: 2px; position: relative; display: inline-flex; align-items: center; border: 0; border-radius: 99px; background: #c8d0dc; transition: .18s; }
    .switch:after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #25395633; transition: transform .18s; }
    .switch.on { background: #3976f6; }
    .switch.on:after { transform: translateX(14px); }
    .switch:disabled { cursor: not-allowed; opacity: .43; }
    .switch-guard { display: inline-flex; align-items: center; }
    .switch-guard.disabled { cursor: not-allowed; }
    .switch-guard.disabled .switch { pointer-events: none; }
    .status-chip { display: inline-flex; align-items: center; gap: 5px; color: #75849a; font-size: 10px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #bdc5d1; }
    .status-dot.green { background: #34a878; }
    .status-dot.amber { background: #e0a23d; }
    .status-dot.red { background: #d95f5f; }
    .action-links { display: flex; align-items: center; gap: 12px; }
    .link-btn { padding: 0; color: #3976f6; border: 0; background: transparent; font-size: 11px; font-weight: 650; }
    .link-btn:hover { color: #174fc1; }
    .more-wrap { position: relative; }
    .more-btn { padding: 4px 6px; color: #74839a; border: 0; border-radius: 5px; background: transparent; font-weight: 700; letter-spacing: 2px; }
    .more-btn:hover { background: #edf2fb; }
    .menu { width: 158px; min-width: 158px; padding: 5px; position: fixed; z-index: 90; top: 0; left: 0; display: none; flex-direction: column; border: 1px solid #e3e9f1; border-radius: 8px; background: #fff; box-shadow: 0 8px 24px rgba(30,55,94,.15); white-space: normal; }
    .menu.open { display: flex; }
    .menu button { width: 100%; min-height: 32px; padding: 7px 9px; display: block; flex: none; color: #53647b; text-align: left; white-space: nowrap; border: 0; border-radius: 5px; background: transparent; font-size: 11px; }
    .menu button:hover { background: #f3f6fb; color: #2e67db; }
    .menu button.danger { margin-top: 3px; color: #c85050; border-top: 1px solid #edf0f5; border-radius: 0 0 5px 5px; }
    .pagination { min-height: 48px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #edf0f5; color: #909db0; font-size: 10px; }
    .page-controls { display: flex; align-items: center; gap: 5px; }
    .page-button { width: 27px; height: 27px; color: #73829a; border: 1px solid #e5eaf1; border-radius: 5px; background: #fff; }
    .page-button.active { color: #3976f6; border-color: #3976f6; background: #f4f7ff; }
    .page-button:disabled { opacity: .45; cursor: not-allowed; }
    .empty { padding: 65px 20px; color: #8e9bb0; text-align: center; }
    .empty strong { display: block; margin: 8px 0 4px; color: #5a6b83; }
    .hidden { display: none !important; }
    #detailPage { min-height: 100vh; margin: -18px -22px -24px; display: flex; flex-direction: column; }
    #detailPage.config-mode { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
    #detailPage.config-mode .detail-content { min-height: 0; overflow: hidden; }
    #detailPage.config-mode .config-layout { height: 100%; min-height: 0; }
    #detailPage.config-mode .version-list { max-height: none; flex: 1; }
    #detailPage.config-mode .flow-panel .panel-body { max-height: none; }
    .detail-banner { padding: 13px 26px; border-bottom: 1px solid #e6ebf2; background: #fff; }
    .detail-banner-inner { max-width: 1600px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .detail-heading { min-width: 0; flex: 1; }
    .detail-banner h1 { margin: 0; color: #243a5b; font-size: 19px; font-weight: 750; line-height: 1.25; letter-spacing: -.02em; }
    .detail-event-name { margin: 4px 0 0; overflow: hidden; color: #8795a9; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .detail-jump { min-height: 34px; padding: 0 11px; display: inline-flex; align-items: center; justify-content: center; flex: none; gap: 6px; color: #356bd4; border: 1px solid #d6e3fa; border-radius: 7px; background: #f7faff; font-size: 11px; font-weight: 700; line-height: 1; }
    .detail-jump:hover { color: #2259c5; border-color: #a8c4f3; background: #eef5ff; }
    .detail-jump svg { width: 16px; height: 16px; flex: none; }
    .detail-content { padding: 13px 14px 14px; }
    .detail-content.page { width: 100%; max-width: none; flex: 1; display: flex; flex-direction: column; }
    #configTab { min-height: 0; flex: 1; display: flex; }
    .detail-back { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; flex: none; color: #5b7090; border: 1px solid #dce5f0; border-radius: 8px; background: #f9fbfe; transition: color .15s,border-color .15s,background .15s; }
    .detail-back:hover { color: #2464db; border-color: #a8c2ef; background: #edf4ff; }
    .detail-back svg { width: 17px; height: 17px; }
    .version-actions { display: flex; align-items: center; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }
    .panel { margin-bottom: 11px; overflow: hidden; }
    .panel-head { min-height: 45px; padding: 0 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #edf0f5; }
    .panel-title { display: flex; align-items: center; gap: 8px; color: #304662; font-size: 12px; font-weight: 750; }
    .step-index { width: 21px; height: 21px; display: grid; place-items: center; color: #3470e8; border-radius: 6px; background: #edf3ff; font-size: 10px; font-weight: 800; }
    .panel-body { padding: 14px 15px; }
    .config-toolbar { margin-bottom: 10px; display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 6px; }
    .source-summary { display: grid; grid-template-columns: 1fr 1.25fr 1fr auto; align-items: center; gap: 14px; }
    .source-summary strong { display: block; color: #394d69; font-size: 11px; }
    .source-summary small { display: block; margin-top: 4px; color: #919eb0; font-size: 10px; }
    .divider-v { width: 1px; height: 30px; background: #edf0f5; }
    .flow-note { color: #8795a9; font-size: 10px; }
    .branch-card { margin-bottom: 10px; overflow: hidden; border: 1px solid #e6ebf2; border-radius: 8px; background: #fff; }
    .branch-card:last-child { margin-bottom: 0; }
    .branch-head { min-height: 39px; padding: 0 11px; display: flex; align-items: center; justify-content: space-between; background: #fafbfd; border-bottom: 1px solid #edf0f5; }
    .branch-label { display: flex; align-items: center; gap: 7px; color: #415570; font-size: 11px; font-weight: 700; }
    .branch-hint { margin-left: 4px; color: #98a6b9; font-size: 10px; font-weight: 400; white-space: nowrap; }
    .branch-label .branch-n { padding: 4px 6px; color: #3976f6; border-radius: 4px; background: #edf3ff; font: 750 9px var(--mono); letter-spacing: .02em; }
    .branch-label .branch-n.else-if-label { color: #a27127; background: #fff5e6; }
    .branch-label .branch-n.else-label { color: #687991; background: #eef1f5; }
    .condition-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .condition-pill { padding: 6px 8px; color: #46638d; border: 1px solid #e2eaf8; border-radius: 5px; background: #f5f8fe; font-size: 10px; }
    .logic { color: #9aa6b6; font-size: 9px; font-weight: 700; }
    .actions-block { margin-top: 10px; padding-top: 9px; border-top: 1px dashed #e8edf4; }
    .mini-label { margin-bottom: 7px; color: #97a2b2; font-size: 9px; font-weight: 750; letter-spacing: .08em; }
    .action-stack { display: flex; flex-wrap: wrap; gap: 6px; }
    .action-item { min-height: 37px; padding: 6px 8px; display: flex; align-items: center; gap: 8px; flex: 1 1 235px; max-width: 360px; border: 1px solid #edf0f5; border-radius: 6px; background: #fff; }
    .action-type-icon { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 6px; background: #edf3ff; color: #4777dc; font-size: 10px; font-weight: 800; }
    .action-type-icon svg { width: 16px; height: 16px; }
    .action-type-icon.expert { color: #805acb; background: #f3effc; }
    .action-type-icon.agent { color: #248c99; background: #e9f7f8; }
    .action-type-icon.tool { color: #b47b2a; background: #fff5e7; }
    .action-item strong { color: #475a74; font-size: 10px; }
    .action-item small { margin-left: auto; color: #9aa6b6; font-size: 9px; }
    .config-layout { width: 100%; min-height: 100%; display: grid; grid-template-columns: 144px minmax(0,1fr); align-items: stretch; gap: 12px; }
    .version-rail { min-height: 0; padding: 13px 9px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e4eaf3; border-radius: 10px; background: #fff; }
    .version-rail-title { padding: 0 10px 10px; color: #7789a4; font-size: 11px; font-weight: 700; }
    .version-pinned { flex: none; }
    .version-separator { height: 1px; margin: 8px 8px 8px; flex: none; background: #e9eef5; }

    .version-list::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    .version-list::-webkit-scrollbar-track { background: transparent; }
    .version-list::-webkit-scrollbar-thumb { border-radius: 99px; background: #e5ebf4; }
    .version-list:hover::-webkit-scrollbar-thumb { background: #d2ddec; }

    .version-entry:hover { background: #f5f8fe; }
    .version-entry.active { color: #2864d9; border-color: #cbdcfb; background: #eef4ff; }
    .version-entry:focus-visible { outline: 2px solid #4a7dfa; outline-offset: 1px; }
    .version-state { padding: 3px 5px; flex: none; border-radius: 4px; background: #e9f7f0; color: #2c9a6b; font-size: 9px; font-weight: 700; }

    function coverageLogsForEvent(e){
      return coverageLogSpecs.map(function(spec){
        const payload={event_id:spec.id,source:"factory.device.events",device_id:spec.device,temperature:spec.temperature,voltage:spec.voltage,status:spec.status,observed_at:spec.time,
          metrics:{temperature_unit:"°C",voltage_unit:"V",vibration_mm_s:spec.status==="critical"?9.2:3.1}};

        const base={id:spec.id,time:spec.time,version:spec.version,ingress:"接入成功",branch:"—",actions:"未执行",result:"未执行",kind:spec.reason==="paused"?"warn":"muted",duration:spec.duration,reason:spec.reason||"",payload:payload,actionRuns:[]};
        if(spec.reason)return base;
        const snapshot=(e.versions||[]).find(function(version){return version.version===spec.version;});
        const branch=snapshot&&(snapshot.branches||[]).find(function(item){return item.name===spec.branch;});
        if(!branch)return null;
        if((branch.actions||[]).length===0){
          if(!isDefaultBranch(branch))return null;
          base.branch=branch.name;base.result="未配置执行动作";base.kind="muted";base.duration="18ms";
          return base;
        }
        const duration=runDurationMs(spec.duration),failedActions=spec.failedActions||[];
        const actionRuns=branch.actions.map(function(action,index){
          const timing=spec.timings&&spec.timings[index];
          const started=timing?timing[0]:20+index*4;
          const finished=timing?timing[1]:Math.max(started+1,duration-80-(branch.actions.length-index-1)*90);
          const failed=failedActions.includes(index);
          return {name:action.name,startedMs:started,finishedMs:Math.min(finished,duration),failed:failed,output:spec.outputs&&spec.outputs[index]||runActionOutput(action.name,spec,failed)};
        });
        base.branch=branch.name;
        base.actions=actionRuns.map(function(run){return run.name;}).join("、");
        base.result=failedActions.length?"执行失败":"执行成功";
        base.kind=failedActions.length?"fail":"success";
        base.actionRuns=actionRuns;
        return base;
      }).filter(Boolean);

        copy.version=log.version==="—"?"—":(i===4&&oldVersion?oldVersion.version:(e.version||"—"));

          copy.reason=pending?"pending":log.reason;

        const snapshot=(e.versions||[]).find(function(v){return v.version===copy.version;});
        const branches=snapshot?snapshot.branches:e.publishedBranches||[];
        const branch=log.scenario==="fallback"?branches.find(isDefaultBranch):branches.find(function(item){return item.name===log.branch;})||branches.find(function(item){return !isDefaultBranch(item);})||branches[0];

    function actionStatsVersionTotals(e){
      if(e.demo&&Number(e.count)===832)return coverageStats.map(function(item){
        const snapshot=(e.versions||[]).find(function(version){return version.version===item.version;});
        return {version:item.version,count:item.count,branches:snapshot?snapshot.branches:[],branchStats:item.branches};
      });
      const versions=e.versions||[],total=Math.max(0,Number(e.count)||0);
      const weightSum=versions.reduce(function(sum,_,index){return sum+versions.length-index;},0);
      let remaining=total;
      return versions.map(function(v,index){
        const count=index===versions.length-1?remaining:Math.floor(total*(versions.length-index)/weightSum);
        remaining-=count;
        return {version:v.version,count:count,branches:v.branches||[]};
      });
    }
    function actionStatsRows(e,selectedVersion){
      const totals=actionStatsVersionTotals(e);
      const versions=selectedVersion==="all"?totals:totals.filter(function(v){return v.version===selectedVersion;});
      const rows=[];
      versions.forEach(function(version){
        const versionIndex=totals.findIndex(function(item){return item.version===version.version;});
        const branches=version.branches;
        branches.forEach(function(branch,branchIndex){
          const summary=version.branchStats&&version.branchStats[branch.name];
          const calls=summary?summary.calls:branches.length?Math.round(version.count/branches.length):0;
          if(calls===0)return;
          (branch.actions||[]).forEach(function(action,actionIndex){
            const rate=(versionIndex+branchIndex+actionIndex)%4+1;
            const failed=summary?summary.failed[actionIndex]||0:Math.floor(calls*rate/100);
            rows.push({version:version.version,branch:branch.name,type:actionTypeName(action.type),name:action.name,success:Math.max(0,calls-failed),failed:failed});
          });
        });
      });
      return rows;
    }

    function matchesCondition(expression,data){
      const match=String(expression).match(/^\s*([a-zA-Z0-9_.]+)\s*(大于等于|小于等于|不等于|大于|小于|等于|包含|>=|<=|==|!=|≥|≤|>|<|=|in)\s*(.*?)\s*$/);
      if(!match)return false;
      const field=match[1],operator=match[2],expected=match[3].replace(/^['"]|['"]$/g,"");
      const actual=field.split(".").reduce(function(value,key){return value==null?undefined:value[key];},data);
      if(actual===undefined||actual===null)return false;
      const left=Number(actual),right=Number(expected),numeric=String(actual).trim()!==""&&String(expected).trim()!==""&&Number.isFinite(left)&&Number.isFinite(right);
      if(operator==="大于"||operator===">")return numeric&&left>right;
      if(operator==="大于等于"||operator===">="||operator==="≥")return numeric&&left>=right;
      if(operator==="小于"||operator==="<")return numeric&&left<right;
      if(operator==="小于等于"||operator==="<="||operator==="≤")return numeric&&left<=right;
      if(operator==="包含")return String(actual).includes(expected);
      if(operator==="in")return expected.split(",").map(function(value){return value.trim();}).includes(String(actual));
      if(operator==="不等于"||operator==="!=")return String(actual)!==expected;
      return String(actual)===expected;
    }
    function runDurationMs(value){
      const match=String(value).match(/^([\d.]+)\s*(ms|s)$/);
      return match?Math.round(Number(match[1])*(match[2]==="s"?1000:1)):0;
    }
    function runDurationSeconds(milliseconds){
      return (milliseconds/1000).toFixed(3).replace(/\.?0+$/,"")+"s";
    }
    function runTimeAt(time,offset,full){
      const date=new Date(time.replace(" ","T"));
      if(Number.isNaN(date.getTime()))return time;
      date.setMilliseconds(date.getMilliseconds()+offset);
      const pad=function(value,length){return String(value).padStart(length,"0");};
      const clock=pad(date.getHours(),2)+":"+pad(date.getMinutes(),2)+":"+pad(date.getSeconds(),2);
      return full?date.getFullYear()+"-"+pad(date.getMonth()+1,2)+"-"+pad(date.getDate(),2)+" "+clock:clock;
    }

    function runActionOutput(name,log,failed){

    function runActionInput(action,payload,name){
      const getField=function(path){return String(path).replace(/^\{\{|\}\}$/g,"").trim().split(".").reduce(function(value,key){return value==null?undefined:value[key];},payload);};
      if(action&&(action.type==="expert"||action.type==="agent")){
        const template=String(action.prompt||"").trim()||"请根据接入数据完成"+name+"，并给出处理结果。";
        return {type:"text",value:template.replace(/\{\{\s*([^{}]+?)\s*\}\}/g,function(match,path){const value=getField(path);return value===undefined?match:String(value);})};
      }
      const mappings=action&&action.params&&typeof action.params==="object"?Object.entries(action.params):[];
      if(mappings.length){
        const values={};
        mappings.forEach(function(entry){
          const key=entry[0],item=entry[1];
          const fixed=item&&typeof item==="object"&&(item.mode==="fixed"||item.mapType==="fixed");
          const source=typeof item==="string"?item:item&&typeof item==="object"?(item.value??item.sourcePath??item.fixedValue):"";
          const value=fixed?source:getField(source);

          points.push(runPoint(runTimeAt(log.time,Math.min(20,duration),false),"执行动作 · "+actionEntries.length+" 个并行触发","各动作独立记录开始、完成时间与输入输出。",log.result==="执行失败"?"fail":"",actionCards||'<div class="run-empty-action">此示例记录没有动作明细。</div>'));
        }
      }
      points.push(runPoint(runTimeAt(log.time,duration,false),"本次处理结束 · "+log.result,"总耗时 "+runDurationSeconds(duration),log.kind==="success"?"":log.kind));
      const body='<div class="run-overview"><div class="run-overview-main"><span class="run-overview-id">'+esc(log.id)+'</span><span class="run-overview-meta">版本 '+esc(log.version)+'　·　接收 '+esc(runTimeAt(log.time,0,true))+'　·　总耗时 '+esc(runDurationSeconds(duration))+'</span></div><span class="run-result-chip '+(log.kind==="success"?"":log.kind)+'">'+esc(log.result)+'</span></div>'+
        '<div class="run-detail-layout"><section class="run-panel"><div class="run-panel-head"><h4>事件数据</h4><p>接入时收到的事件内容</p></div><div class="run-panel-scroll run-data-scroll"><dl class="run-source-meta"><dt>来源</dt><dd>'+esc(event.type+' / '+event.info)+'</dd><dt>接收时间</dt><dd>'+esc(runTimeAt(log.time,0,true))+'</dd></dl><div class="run-section-label">接入数据</div><pre class="run-json run-data-json">'+esc(rawData)+'</pre></div></section>'+
        '<section class="run-panel"><div class="run-panel-head"><h4>执行详情</h4><p>按发生时间记录接入、条件判断和动作执行</p></div><div class="run-panel-scroll">'+points.join("")+'</div></section></div>';
      openModal("事件详情",body,'<div class="right"><button class="btn btn-small" data-close>关闭</button></div>',true);
      document.getElementById("modal").classList.add("run-detail-dialog");
    }
    function publishSelectedVersion(){
      const e=currentEvent();
      const publishingDraft=selectedConfigView==="draft";
      const sourceVersion=publishingDraft?"草稿":selectedConfigView.slice(8);
      const sourceSnapshot=publishingDraft?e.draft:(e.versions||[]).find(function(v){return v.version===sourceVersion;});
      if(!sourceSnapshot){showToast("所选版本不存在");return;}
      if(!sourceSnapshot.branches.some(function(branch){return (branch.actions||[]).length>0;})){showToast("请先添加至少一个执行动作");return;}
      if(publishingDraft&&sourceSnapshot.branches.some(function(branch){return !isDefaultBranch(branch)&&!(branch.actions||[]).length;})){showToast("请为每个条件分支配置执行动作");return;}
      if(!e.status){showToast("请先在事件列表开启接入开关，再发布运行");return;}
      const openPublishDialog=function(){
      const publishNote=publishingDraft?'发布后将替换当前运行版本，并生成一份空白草稿，需要重新配置处理流程。':'将使用原版本号重新发布 '+sourceVersion+'，替换当前运行版本 '+(hasPublishedConfig(e)?e.version:"（暂无）")+'；当前运行版本会保留为历史版本。';
      const versionField=publishingDraft
        ? '<div class="form-field"><label for="publishVersion">版本号</label><input id="publishVersion" placeholder="例如：v1.0.0" autocomplete="off"><div class="publish-version-hint">格式：v主版本号.次版本号.修订号，例如 v1.2.3；同一事件内不可重复</div></div>'
        : '<div class="form-field"><label>版本号</label><input value="'+esc(sourceVersion)+'" readonly></div>';
      const body='<div class="publish-version-form">'+versionField+'<div class="form-field"><label for="publishDesc">版本描述</label><input id="publishDesc" maxlength="80" value="'+esc(sourceSnapshot.description||"")+'" placeholder="简要说明此版本的配置变更"></div><div class="info-line">'+esc(publishNote)+'</div></div>';
      openModal("发布运行",body,'<span class="flow-note">'+(publishingDraft?(sourceSnapshot.tested?'草稿已完成测试':'草稿尚未测试'):'原版本号不可修改')+'</span><div class="right"><button class="btn btn-small" data-close>取消</button><button class="btn btn-primary btn-small" id="confirmPublish">确认发布</button></div>',false);
      document.getElementById("modal").classList.add("publish-dialog");
      document.getElementById("confirmPublish").addEventListener("click",function(){
        const version=publishingDraft?document.getElementById("publishVersion").value.trim():sourceVersion;
        if(publishingDraft&&!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)){showToast("版本号格式应为 v主版本号.次版本号.修订号，例如 v1.2.3");return;}
        if(publishingDraft&&(e.version===version||e.versions.some(function(v){return v.version===version;}))){showToast("该版本号已存在，请输入其他版本号");return;}
        const description=document.getElementById("publishDesc").value.trim();
        if(!e.versions)e.versions=[];
        if(hasPublishedConfig(e)&&!e.versions.some(function(v){return v.version===e.version;})){
          e.versions.unshift({version:e.version,description:"发布前当前版本",time:new Date().toLocaleString("zh-CN"),branches:JSON.parse(JSON.stringify(e.publishedBranches||[]))});
        }
        e.publishedBranches=normalizeFlowBranches(sourceSnapshot.branches);
        e.version=version;e.config="ready";e.actionsOn=true;
        if(publishingDraft)e.draft={branches:normalizeFlowBranches([]),description:"",tested:false,dirty:false};
        e.branches=JSON.parse(JSON.stringify(e.draft.branches));
        selectedConfigView="current";
        if(publishingDraft){
          e.versions.unshift({version:version,description:description,time:new Date().toLocaleString("zh-CN"),branches:JSON.parse(JSON.stringify(e.publishedBranches)),tested:!!sourceSnapshot.tested});
        }else{
          const republished=Object.assign({},sourceSnapshot,{version:version,description:description,time:new Date().toLocaleString("zh-CN"),branches:JSON.parse(JSON.stringify(e.publishedBranches))});
          e.versions=e.versions.filter(function(v){return v.version!==version;});
          e.versions.unshift(republished);
        }
        persist();closeModal();renderDetail();renderList();showToast(publishingDraft?"已发布新版本："+version:"已重新发布历史版本："+version);
      });
      };
      if(!sourceSnapshot.tested){
        openConfirmModal("发布前建议测试",'<div class="info-line">当前版本尚未测试。建议先测试处理流程，确认分支判断和执行动作符合预期；你也可以继续发布。</div>','<span></span><div class="right"><button class="btn btn-small" data-close>取消</button><button class="btn btn-small" id="testBeforePublish">先去测试</button><button class="btn btn-primary btn-small" id="continuePublish">继续发布</button></div>');
        document.getElementById("testBeforePublish").addEventListener("click",function(){closeModal();showTestModal();});
        document.getElementById("continuePublish").addEventListener("click",function(){closeModal();openPublishDialog();});
        return;
      }
      openPublishDialog();
    }
    function incrementVersion(version){const p=version.replace(/^v/,"").split(".").map(Number);p[p.length-1]=(p[p.length-1]||0)+1;return "v"+p.join(".");}
    function previousVersion(version){
      const p=version.replace(/^v/,"").split(".").map(Number);
      if(p[2]>0)p[2]--;
      else if(p[1]>0)p[1]--;
      else if(p[0]>0){p[0]--;p[1]=9;}
      return "v"+p.join(".");
    }
    function doOperation(event,op){
      if(op==="config"){openEvent(event.id,"config");}
      else if(op==="logs"){openEvent(event.id,"logs");}
      else if(op==="edit"){showEventModal(event.id);}
      else if(op==="detail-edit"){showEventModal(event.id);}
      else if(op==="duplicate"){
        const copy=JSON.parse(JSON.stringify(event));copy.id=Date.now();copy.name=event.name+"（副本）";copy.status=false;copy.actionsOn=false;copy.count=0;copy.publishedBranches=JSON.parse(JSON.stringify(event.publishedBranches||[]));copy.draft={branches:normalizeFlowBranches(event.draft?event.draft.branches:copy.publishedBranches),tested:false,dirty:false};copy.branches=JSON.parse(JSON.stringify(copy.draft.branches));copy.config=hasPublishedConfig(event)?"ready":"draft";copy.versions=JSON.parse(JSON.stringify(event.versions||[]));copy.version=event.version||"-";events.unshift(copy);persist();renderList();showToast("事件副本已创建，默认停止接入");
      }else if(op==="delete"){
        openConfirmModal("删除事件",'<div class="info-line">确定删除“'+esc(event.name)+'”吗？删除后将无法继续接收该事件，历史运行记录仍保留。</div>','<span></span><div class="right"><button class="btn btn-small" data-close>取消</button><button class="btn btn-danger btn-small" id="confirmDelete">删除事件</button></div>');
        document.getElementById("confirmDelete").addEventListener("click",function(){events=events.filter(function(x){return x.id!==event.id;});persist();closeModal();renderList();showToast("事件已删除");});
      }
    }
    document.getElementById("eventRows").addEventListener("click",function(ev){
      const row=ev.target.closest("tr[data-id]");if(!row)return;
      const event=events.find(function(x){return x.id===Number(row.dataset.id);});if(!event)return;
      const toggle=ev.target.closest("[data-toggle]");
      if(toggle){
        if(toggle.dataset.toggle==="intake"){
          if(event.status){
            event.status=false;event.actionsOn=false;
            showToast(eventRunState(event)==="pending"?"接入已关闭，待发布事件不再接收新消息":"接入已关闭，处理已同步关闭；事件暂停运行");
          } else {
            event.status=true;
            showToast(eventRunState(event)==="pending"?"接入已开启；处理流程待发布，处理开关暂不可用":"接入已开启；处理保持关闭，事件仍为暂停运行");
          }
          persist();renderList();return;
        }
        if(toggle.dataset.toggle==="actions"&&!toggle.disabled&&eventRunState(event)!=="pending"&&event.status){
          event.actionsOn=!event.actionsOn;persist();renderList();showToast(event.actionsOn?"处理已开启，事件运行中":"处理已关闭，事件暂停运行；接入保持开启");return;
        }
      }
      const opButton=ev.target.closest("[data-op]");
      if(!opButton)return;
      const op=opButton.dataset.op;
      if(op==="more"){
        toggleRowMenu(opButton);return;
      }
      closeRowMenus();
      doOperation(event,op);
    });
    document.getElementById("eventPageControls").addEventListener("click",function(e){
      const button=e.target.closest("[data-page]");if(!button||button.disabled)return;
      const target=button.dataset.page;
      eventPage=target==="prev"?eventPage-1:target==="next"?eventPage+1:Number(target);
      renderRows();
    });
    document.getElementById("searchInput").addEventListener("input",function(e){filterState.search=e.target.value;eventPage=1;renderRows();});
    document.getElementById("sourceFilter").addEventListener("change",function(e){filterState.source=e.target.value;eventPage=1;renderRows();});
    document.getElementById("intakeFilter").addEventListener("change",function(e){filterState.intake=e.target.value;eventPage=1;renderRows();});
    document.getElementById("statusFilter").addEventListener("change",function(e){filterState.state=e.target.value;eventPage=1;renderRows();});
    document.getElementById("addEventBtn").addEventListener("click",function(){showEventModal(null);});
    document.getElementById("backBtn").addEventListener("click",backToList);
    document.getElementById("detailJumpBtn").addEventListener("click",function(){activeTab=activeTab==="config"?"logs":"config";if(activeTab==="config"){const e=currentEvent();selectedConfigView=hasPublishedConfig(e)?"current":"draft";renderedConfigEventId=null;}renderDetail();window.scrollTo(0,0);});
    document.getElementById("modalClose").addEventListener("click",closeModal);
    document.getElementById("modalBackdrop").addEventListener("click",function(e){if(e.target.id==="modalBackdrop")closeModal();});
    document.getElementById("mobileMenu").addEventListener("click",function(){document.getElementById("sidebar").classList.toggle("mobile-open");});
    document.getElementById("nav-center").addEventListener("click",function(e){e.preventDefault();backToList();});
    document.querySelectorAll("[data-static]").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();showToast("此原型聚焦事件中心");});});
    document.addEventListener("mouseover",function(e){
      const target=e.target.closest&&e.target.closest("[data-tooltip]");
      if(target&&target!==hoverTooltipTarget)showHoverTooltip(target);
    });
    document.addEventListener("mouseout",function(e){
      if(hoverTooltipTarget&&hoverTooltipTarget.contains(e.target)&&!hoverTooltipTarget.contains(e.relatedTarget))hideHoverTooltip();
    });
    document.addEventListener("focusin",function(e){
      const target=e.target.closest&&e.target.closest("[data-tooltip]");
      if(target)showHoverTooltip(target);
    });
    document.addEventListener("focusout",function(e){
      if(hoverTooltipTarget&&hoverTooltipTarget.contains(e.target))hideHoverTooltip();
    });
    window.addEventListener("scroll",hideHoverTooltip,true);
    window.addEventListener("scroll",closeRowMenus,true);
    window.addEventListener("resize",closeRowMenus);
    document.addEventListener("click",function(e){if(!e.target.closest(".more-wrap"))closeRowMenus();if(!e.target.closest("#testHistoryPicker"))closeHistoryPopover(false);});
    document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!closeHistoryPopover(true))closeModal();});
    renderList();
  </script>
</body>
</html>
